name: Probar proxy Cloudflare (diagnóstico)

# Prueba manual desde la pestaña Actions. Mide, desde GitHub (EE.UU.):
#  1) conexión DIRECTA a cada uno de los 2 servidores del BORA, por separado;
#  2) conexión a través del Worker de Cloudflare.
# Sirve para saber si el corte es total, intermitente o depende del servidor.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Directo a cada servidor del BORA (6 intentos c/u)
        run: |
          for IP in 200.108.150.10 200.108.151.10; do
            OK=0
            for i in 1 2 3 4 5 6; do
              R=$(curl -s -o /dev/null -w "%{http_code} %{time_connect}s" --connect-timeout 10 -m 30 \
                  --resolve www.boletinoficial.gob.ar:443:$IP \
                  -A "Mozilla/5.0" https://www.boletinoficial.gob.ar/seccion/primera || true)
              echo "$IP intento $i → $R"
              case "$R" in 200*) OK=$((OK+1));; esac
            done
            echo "== $IP: $OK de 6 respondieron =="
          done

      - name: A través del Worker (5 intentos)
        run: |
          for i in 1 2 3 4 5; do
            echo "── Intento $i ──"
            curl -sS -m 90 https://bora-proxy.politicaspublicas.workers.dev/ || echo "FALLÓ la llamada al Worker"
            echo
          done
